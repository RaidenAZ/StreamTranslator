name: Release

# 触发时机：任何 push 到 master 的提交（含 PR 合并），
# 但只有 csproj 中的版本号还没有对应的 Release tag 时才构建发布，版本号不变则跳过。
on:
  push:
    branches:
      - master

# 创建 Release 和 tag 需要写权限
permissions:
  contents: write

# 串行执行：连续 push 同一个新版本时，后一次等前一次打完 tag 再检查，避免重复发布
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 版本检查：该版本从未发布过才放行 release job ─────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
      name: ${{ steps.ver.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取全部 tag，用于判断版本是否已发布

      - name: Read version and check existing tags
        id: ver
        shell: pwsh
        run: |
          $xml   = [xml](Get-Content src/StreamTranslator.App/StreamTranslator.App.csproj)
          $ver   = $xml.Project.PropertyGroup.Version
          if (-not $ver) { throw "Version not found in StreamTranslator.App.csproj" }
          # tag 格式为 v<版本>；该 tag 已存在即视为已发布
          $existing = git tag --list "v${ver}"
          if ($existing) {
            Write-Host "Version $ver already released ($existing), skipping."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Version $ver has not been released yet."
            "release=true" >> $env:GITHUB_OUTPUT
          }
          "tag=v${ver}"  >> $env:GITHUB_OUTPUT
          "name=StreamTranslator v${ver}" >> $env:GITHUB_OUTPUT

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      # ── 代码检出 ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，供 generate_release_notes 使用

      # ── 运行时环境 ────────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 缓存：避免重复下载模型和 Python 依赖 ─────────────────────────────────
      - name: Cache Silero VAD model
        uses: actions/cache@v4
        with:
          path: models/silero_vad.onnx
          # Key 绑定 ensure-model.ps1 中硬编码的 SHA256；
          # 脚本升级模型版本时 key 自动失效并重新下载。
          key: silero-vad-1A153A22F4509E292A94E67D6F9B85E8DEB25B4988682B7E174C65279D8788E3

      - name: Cache Python build venv
        uses: actions/cache@v4
        with:
          path: artifacts/build-venv
          key: ${{ runner.os }}-venv-${{ hashFiles('python/requirements-build.txt') }}

      # ── 测试─────────────────────────────────────────────────────────────────
      # Integration 类测试（TestCategory=Integration）依赖真实 Python+openai 运行时，
      # 仅在本地完整环境中执行；CI 只跑单元测试和协议测试。
      - name: Run .NET tests
        shell: pwsh
        run: |
          dotnet test --nologo `
            --filter "TestCategory!=Integration" `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      # ── 构建发行包 ────────────────────────────────────────────────────────────
      # publish.ps1 会依次执行：
      #   1. ensure-model.ps1 — 校验 / 下载 silero_vad.onnx（有缓存时直接通过）
      #   2. dotnet publish   — 编译 .NET 10 WPF 应用
      #   3. PyInstaller      — 打包 asr_worker 和 translation_worker
      #   4. 复制运行时模型，生成 artifacts/StreamTranslator 便携包
      - name: Build portable package
        shell: pwsh
        run: scripts/publish.ps1

      # ── 打包为 ZIP ────────────────────────────────────────────────────────────
      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/StreamTranslator/* `
            -DestinationPath "artifacts/StreamTranslator-${{ needs.check.outputs.tag }}-win-x64.zip"

      # ── 发布 GitHub Release ───────────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.name }}
          files: artifacts/StreamTranslator-${{ needs.check.outputs.tag }}-win-x64.zip
          generate_release_notes: true   # 自动从 PR/commit 生成 release notes
